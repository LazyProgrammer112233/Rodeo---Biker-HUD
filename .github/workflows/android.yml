name: Android APK

on:
  push:
    branches: [ main, "p1-*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME=$HOME/android-sdk
            mkdir -p $ANDROID_HOME/cmdline-tools
            curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      # Build logs are pushed to the ci-logs branch so failures can be read without log access.
      - name: Publish build log
        if: always()
        run: |
          [ -f build.log ] || echo "no build log (failed before Gradle)" > build.log
          cp build.log /tmp/build.log
          git config user.name "rodeo-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout -B ci-logs
          git rm -rq --cached . || true
          mkdir -p logs && cp /tmp/build.log "logs/${GITHUB_REF_NAME//\//_}.log"
          git add -f logs && git commit -qm "Build log for ${GITHUB_SHA::7} (${{ job.status }})" && git push -f origin ci-logs || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Rodeo-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rodeo-apk
          path: Rodeo-${{ github.run_number }}.apk

      - name: Publish rolling pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Rodeo ${{ github.ref_name }} (build ${{ github.run_number }})
          prerelease: true
          files: Rodeo-${{ github.run_number }}.apk
