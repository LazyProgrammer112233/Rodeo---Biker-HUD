name: Android APK

on:
  push:
    branches: [ main, "p1-*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME=$HOME/android-sdk
            mkdir -p $ANDROID_HOME/cmdline-tools
            curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Keep one signing key across builds so new APKs install over old ones and the
      # Maps key SHA-1 stays valid. Prefer the SIGNING_* secrets; fall back to a cached debug key.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rodeo-debug-keystore-v1

      # Create the debug key up front so the cache always has a file to save.
      - name: Debug key
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Signing key from secrets
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/rodeo.jks
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/rodeo.jks" >> $GITHUB_ENV
          fi

      # Barlow Condensed and Inter (SIL Open Font License) are fetched at build time.
      - name: Fonts
        run: |
          set -e
          D=app/src/main/res/font
          mkdir -p $D
          G=https://github.com/google/fonts/raw/main/ofl/barlowcondensed
          for p in SemiBold:semibold Bold:bold ExtraBold:extrabold Black:black BoldItalic:bold_italic ExtraBoldItalic:extrabold_italic BlackItalic:black_italic; do
            curl -sSLf --retry 3 -o "$D/barlow_condensed_${p#*:}.ttf" "$G/BarlowCondensed-${p%%:*}.ttf"
          done
          curl -sSLf --retry 3 -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
          unzip -q -o /tmp/inter.zip 'extras/ttf/Inter-Regular.ttf' 'extras/ttf/Inter-Medium.ttf' 'extras/ttf/Inter-SemiBold.ttf' 'extras/ttf/Inter-Bold.ttf' -d /tmp/inter
          for p in Regular:regular Medium:medium SemiBold:semibold Bold:bold; do
            cp "/tmp/inter/extras/ttf/Inter-${p%%:*}.ttf" "$D/inter_${p#*:}.ttf"
          done
          ls -la $D

      - name: Build debug APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      # Render the HUD at phone and tablet sizes, day and night, for several brands, so clipped
      # text or buttons show up without a device. The images go to the ci-logs branch.
      - name: Screenshots
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests 'com.rodeo.hud.shots.*' 2>&1 | tee shots.log | grep -E "^e: |FAILED|BUILD|tests completed" | tail -60
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -q "<failure" "$f" && sed -n '/<failure/,/<\/failure>/p' "$f" | head -60 >> shots.log
          done; true

      # Read the certificate from the APK itself, so the SHA-1 is the one Maps will see.
      - name: Signing fingerprint (for the Maps key restriction)
        if: always()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] && "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" 2>&1 | grep -E "SHA-1|SHA-256" | sed 's/^/SIGNING /' | tee -a build.log || true

      # Build logs are pushed to the ci-logs branch so failures can be read without log access.
      - name: Publish build log
        if: always()
        run: |
          [ -f build.log ] || echo "no build log (failed before Gradle)" > build.log
          cp build.log /tmp/build.log
          REF="${GITHUB_REF_NAME//\//_}"
          rm -rf /tmp/shots && mkdir -p /tmp/shots
          [ -f shots.log ] && cp shots.log /tmp/shots.log
          ls app/build/shots/*.png >/dev/null 2>&1 && cp app/build/shots/*.png /tmp/shots/
          git config user.name "rodeo-ci"
          git config user.email "ci@users.noreply.github.com"
          # Push and pull request runs finish together, so add to the branch instead of replacing it.
          for i in 1 2 3; do
            git fetch -q origin ci-logs && git checkout -qf -B ci-logs origin/ci-logs || { git checkout -qB ci-logs; git rm -rq --cached .; }
            mkdir -p logs && cp /tmp/build.log "logs/$REF.log"
            [ -f /tmp/shots.log ] && cp /tmp/shots.log "logs/$REF-shots.log"
            if ls /tmp/shots/*.png >/dev/null 2>&1; then
              rm -rf "shots/$REF" && mkdir -p "shots/$REF" && cp /tmp/shots/*.png "shots/$REF/" && git add -fA shots
            fi
            git add -f logs && git commit -qm "Build log for ${GITHUB_SHA::7} (${{ job.status }})" || true
            git push origin ci-logs && break
            sleep 3
          done || true

      # Pull request runs have ref_name "1/merge", so name the APK after the source branch.
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Rodeo-${{ github.head_ref || github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Rodeo-apk
          path: Rodeo-${{ github.head_ref || github.ref_name }}.apk

      - name: Publish rolling pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Rodeo ${{ github.ref_name }} (build ${{ github.run_number }})
          prerelease: true
          files: Rodeo-${{ github.ref_name }}.apk
          overwrite_files: true
