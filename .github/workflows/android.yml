name: Android APK

on:
  push:
    branches: [ main, "p1-*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME=$HOME/android-sdk
            mkdir -p $ANDROID_HOME/cmdline-tools
            curl -sSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          fi
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Keep one signing key across builds so new APKs install over old ones and the
      # Maps key SHA-1 stays valid. Prefer the SIGNING_* secrets; fall back to a cached debug key.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rodeo-debug-keystore-v1

      # Create the debug key up front so the cache always has a file to save.
      - name: Debug key
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Signing key from secrets
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/rodeo.jks
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/rodeo.jks" >> $GITHUB_ENV
          fi

      # Offline speech model (Vosk, Apache 2.0) and the MediaPipe hand model, bundled into the APK.
      - uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/vosk-model
            app/src/main/assets/gesture_recognizer.task
          key: rodeo-models-v1-small-en-in-0.4

      # Fonts (SIL Open Font License), the offline speech model (Vosk) and the hand model.
      - name: Fonts and models
        run: bash tools/ci/assets.sh

      - name: Build debug APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      # Health check of the free, keyless map services, saving real answers as test fixtures
      # (routes across Indian cities) so the turn-by-turn engine is replayed on real roads.
      - name: Probe map services
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          F=app/src/test/resources/live
          mkdir -p $F /tmp/probe
          route() { # name from_lat from_lon to_lat to_lon costing
            J="{\"locations\":[{\"lat\":$2,\"lon\":$3},{\"lat\":$4,\"lon\":$5}],\"costing\":\"$6\",\"directions_options\":{\"units\":\"kilometers\",\"language\":\"en-US\"}}"
            curl -s -m 40 -A RodeoHUD-CI/1.0 -G --data-urlencode "json=$J" https://valhalla1.openstreetmap.de/route -o "$F/valhalla-$1.json"
            echo "== valhalla $1: $(head -c 300 "$F/valhalla-$1.json")"
          }
          {
            route bengaluru-nandi 12.9716 77.5946 13.3702 77.6835 motorcycle
            route chandigarh-sukhna 30.7398 76.7827 30.7421 76.8188 motorcycle
            route mumbai-bandra-juhu 19.0596 72.8295 19.0988 72.8267 motorcycle
            route delhi-cp-indiagate 28.6315 77.2167 28.6129 77.2295 motorcycle
            route walk-to-bike 12.9716 77.5946 12.9731 77.5961 pedestrian
            curl -s -m 30 "https://routing.openstreetmap.de/routed-car/route/v1/driving/76.7827,30.7398;76.8188,30.7421?overview=full&geometries=polyline6&steps=true" -o $F/osrm-chandigarh-sukhna.json
            echo "== osrm: $(head -c 300 $F/osrm-chandigarh-sukhna.json)"
            curl -s -m 30 "https://photon.komoot.io/api/?q=nandi%20hills&limit=5&lang=en&lat=12.97&lon=77.59" -o $F/photon-nandi.json
            echo "== photon: $(head -c 300 $F/photon-nandi.json)"
            for q in lalbagh nandi+hills hp+petrol+pump kempegowda+airport indiranagar; do
              curl -s -m 30 "https://photon.komoot.io/api/?q=$q&limit=8&lang=en&lat=12.97&lon=77.59&location_bias_scale=0.4" -o "$F/search-photon-${q//+/-}.json"
              curl -s -m 30 -A RodeoHUD-CI/1.0 "https://nominatim.openstreetmap.org/search?q=$q&format=jsonv2&limit=8&countrycodes=in&viewbox=76.09,14.47,79.09,11.47" -o "$F/search-nominatim-${q//+/-}.json"
              sleep 1
            done
            echo "== nominatim: $(curl -s -m 30 -A RodeoHUD-CI/1.0 'https://nominatim.openstreetmap.org/search?q=nandi+hills&format=jsonv2&limit=1&countrycodes=in' | head -c 300)"
            # Map tiles (2x2 around central Bengaluru, Delhi and Mumbai) from both keyless servers.
            for city in "blr 23446 15193" "del 23412 13662" "bom 23013 14616"; do
              read -r name x0 y0 <<< "$city"
              for d in 00 01 10 11; do
                x=$((x0 + ${d:0:1})); y=$((y0 + ${d:1:1}))
                for src in osm hot; do
                  if [ $src = osm ]; then base=https://tile.openstreetmap.org; else base=https://a.tile.openstreetmap.fr/hot; fi
                  echo "== tile $src $name $d $(curl -s -m 20 -A RodeoHUD-CI/1.0 -o /tmp/probe/tile-$src-$name-$d.png -w '%{http_code} %{content_type} %{size_download}' $base/15/$x/$y.png)"
                done
              done
            done
          } > probe.log 2>&1
          ls -la $F >> probe.log; cat probe.log | head -60

      # Unit tests (routing, voice, gestures) and screenshots of every screen at phone and tablet
      # sizes, day and night. Images and logs go to the ci-logs branch.
      - name: Tests and screenshots
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest --tests 'com.rodeo.hud.shots.*' --tests 'com.rodeo.hud.logic.*' 2>&1 | tee shots.log | grep -E "^e: |FAILED|BUILD|tests completed" | tail -60
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            grep -q "<failure" "$f" && sed -n '/<failure/,/<\/failure>/p' "$f" | head -60 >> shots.log
          done
          grep -h -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml >> shots.log || true
          true

      # Voice accuracy: synthetic riders (Indian-accented voices first) saying the wake phrase,
      # commands, SOS and everyday chatter over engine and wind noise, played through the real
      # offline recogniser and the app's own wake-phrase and command logic.
      - uses: actions/setup-python@v5
        if: github.event_name == 'push'
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        if: github.event_name == 'push'
        with:
          path: ~/.cache/piper
          key: piper-voices-v1

      - name: Voice evaluation
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -e
          sudo apt-get install -y -qq espeak-ng > /dev/null 2>&1 || true
          pip install -q "piper-tts==1.2.0" numpy || pip install -q numpy
          mkdir -p ~/.cache/piper
          H=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en
          for v in en_GB/vctk/medium/en_GB-vctk-medium en_US/lessac/medium/en_US-lessac-medium en_GB/alan/medium/en_GB-alan-medium; do
            n=$(basename $v)
            [ -s ~/.cache/piper/$n.onnx ] || curl -sfL -o ~/.cache/piper/$n.onnx $H/$v.onnx || true
            [ -s ~/.cache/piper/$n.onnx.json ] || curl -sfL -o ~/.cache/piper/$n.onnx.json $H/$v.onnx.json || true
          done
          python3 tools/voice-eval/gen.py /tmp/clips ~/.cache/piper 2>&1 | tail -20
          ./gradlew -q --no-daemon -p tools/voice-eval installDist
          mkdir -p app/build/reports-rodeo
          # The recogniser's maths library keeps its own thread pool, which breaks when several
          # recognisers run side by side unless it is limited to one thread each.
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          ev() { tools/voice-eval/build/install/voice-eval/bin/voice-eval app/src/main/assets/vosk-model /tmp/clips \
            app/build/reports-rodeo/voice-eval.txt app/build/reports-rodeo/voice-eval.json > /tmp/eval.log 2>&1; }
          ev || { grep -v WARNING /tmp/eval.log | tail -5; echo "retrying on one thread"; EVAL_THREADS=1 ev; } || true
          grep -v "WARNING\|^LOG" /tmp/eval.log | head -120

      # Read the certificate from the APK itself, so the SHA-1 is the one Maps will see.
      - name: Signing fingerprint (for the Maps key restriction)
        if: always()
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] && "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" 2>&1 | grep -E "SHA-1|SHA-256" | sed 's/^/SIGNING /' | tee -a build.log || true

      # Build logs are pushed to the ci-logs branch so failures can be read without log access.
      - name: Publish build log
        if: always()
        run: |
          [ -f build.log ] || echo "no build log (failed before Gradle)" > build.log
          cp build.log /tmp/build.log
          REF="${GITHUB_REF_NAME//\//_}"
          rm -rf /tmp/shots && mkdir -p /tmp/shots
          [ -f shots.log ] && cp shots.log /tmp/shots.log
          [ -f probe.log ] && cp probe.log /tmp/probe.log
          rm -rf /tmp/probe-out && mkdir -p /tmp/probe-out
          cp app/src/test/resources/live/*.json /tmp/probe-out/ 2>/dev/null || true
          cp /tmp/probe/*.png /tmp/probe-out/ 2>/dev/null || true
          cp app/build/reports-rodeo/*.txt app/build/reports-rodeo/*.json /tmp/probe-out/ 2>/dev/null || true
          ls app/build/shots/*.png >/dev/null 2>&1 && cp app/build/shots/*.png /tmp/shots/
          git config user.name "rodeo-ci"
          git config user.email "ci@users.noreply.github.com"
          # Push and pull request runs finish together, so add to the branch instead of replacing it.
          for i in 1 2 3; do
            git fetch -q origin ci-logs && git checkout -qf -B ci-logs origin/ci-logs || { git checkout -qB ci-logs; git rm -rq --cached .; }
            mkdir -p logs && cp /tmp/build.log "logs/$REF.log"
            [ -f /tmp/shots.log ] && cp /tmp/shots.log "logs/$REF-shots.log"
            [ -f /tmp/probe.log ] && cp /tmp/probe.log "logs/$REF-probe.log"
            if ls /tmp/probe-out/* >/dev/null 2>&1; then
              rm -rf "probe/$REF" && mkdir -p "probe/$REF" && cp /tmp/probe-out/* "probe/$REF/" && git add -fA probe
            fi
            if ls /tmp/shots/*.png >/dev/null 2>&1; then
              rm -rf "shots/$REF" && mkdir -p "shots/$REF" && cp /tmp/shots/*.png "shots/$REF/" && git add -fA shots
            fi
            git add -f logs && git commit -qm "Build log for ${GITHUB_SHA::7} (${{ job.status }})" || true
            git push origin ci-logs && break
            sleep 3
          done || true

      # Pull request runs have ref_name "1/merge", so name the APK after the source branch.
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Rodeo-${{ github.head_ref || github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Rodeo-apk
          path: Rodeo-${{ github.head_ref || github.ref_name }}.apk

      - name: Publish rolling pre-release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: Rodeo ${{ github.ref_name }} (build ${{ github.run_number }})
          prerelease: true
          files: Rodeo-${{ github.ref_name }}.apk
          overwrite_files: true

  # The real app on an Android emulator: search, route, ride to arrival, reroute, music card.
  device:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/vosk-model
            app/src/main/assets/gesture_recognizer.task
          key: rodeo-models-v1-small-en-in-0.4

      - name: Fonts and models
        run: bash tools/ci/assets.sh

      - name: Build for the emulator
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon -Prodeo.e2e assembleDebug assembleDebugAndroidTest 2>&1 | tee device-build.log | grep -E "^e: |FAILED|BUILD" | tail -30

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/ci/device-test.sh

      - name: Publish device results
        if: always()
        run: |
          REF="${GITHUB_REF_NAME//\//_}"
          mkdir -p device-out
          [ -f device-build.log ] && cp device-build.log device-out/build.log
          rm -rf /tmp/device && cp -r device-out /tmp/device
          git config user.name "rodeo-ci"
          git config user.email "ci@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin ci-logs && git checkout -qf -B ci-logs origin/ci-logs || { git checkout -qB ci-logs; git rm -rq --cached .; }
            rm -rf "device/$REF" && mkdir -p "device/$REF" && cp -r /tmp/device/* "device/$REF/" 2>/dev/null
            git add -fA device && git commit -qm "Device test for ${GITHUB_SHA::7} (${{ job.status }})" || true
            git push origin ci-logs && break
            sleep $((RANDOM % 7 + 3))
          done || true
